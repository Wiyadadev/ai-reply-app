<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top, #1a1a2e, #0f0f0f);
    color: white;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* Header */
.header {
    padding: 15px 20px;
    font-weight: 600;
    font-size: 18px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #222;
}

/* Chat */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

/* Message */
.msg {
    margin-bottom: 15px;
    display: flex;
    animation: fadeIn 0.3s ease;
}

.user {
    justify-content: flex-end;
}

.bot {
    justify-content: flex-start;
}

.bubble {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 15px;
    font-size: 14px;
}

.user .bubble {
    background: linear-gradient(135deg,#00f5ff,#6a00ff);
}

.bot .bubble {
    background: #1e1e2f;
}

/* Input */
.input-area {
    display: flex;
    padding: 15px;
    border-top: 1px solid #222;
    background: #111;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #1a1a2e;
    color: white;
}

button {
    margin-left: 10px;
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg,#00f5ff,#6a00ff);
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

/* Animation */
@keyframes fadeIn {
    from {opacity:0; transform: translateY(10px);}
    to {opacity:1; transform: translateY(0);}
}

/* Typing */
.typing {
    font-size: 12px;
    color: #aaa;
    animation: blink 1s infinite;
}

@keyframes blink {
    0%{opacity:0.2;}
    50%{opacity:1;}
    100%{opacity:0.2;}
}
</style>
</head>

<body>

<div class="header">🤖 AI Assistant</div>

<div class="chat" id="chat"></div>

<div class="input-area">
    <input type="text" id="prompt" placeholder="Type your message...">
    <button onclick="send()">Send</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("prompt");

function addMessage(text, type) {
    const msg = document.createElement("div");
    msg.className = "msg " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerText = text;

    msg.appendChild(bubble);
    chat.appendChild(msg);

    chat.scrollTop = chat.scrollHeight;
}

async function send() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    const typingMsg = document.createElement("div");
    typingMsg.className = "msg bot";
    typingMsg.innerHTML = `<div class="bubble typing">Typing...</div>`;
    chat.appendChild(typingMsg);

    chat.scrollTop = chat.scrollHeight;

    try {
        const res = await fetch("/generate", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ prompt: text })
        });

        const data = await res.json();
        typingMsg.remove();
        addMessage(data.reply, "bot");

    } catch {
        typingMsg.remove();
        addMessage("Error ❌", "bot");
    }
}

// กด Enter ส่งได้
input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        send();
    }
});
</script>

</body>
</html>
