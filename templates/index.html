<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #0f0f0f;
    color: white;
    display: flex;
    height: 100vh;
}

/* Sidebar */
.sidebar {
    width: 250px;
    background: #111;
    padding: 20px;
    border-right: 1px solid #222;
}

.sidebar h2 {
    margin-bottom: 20px;
}

.new-chat {
    background: linear-gradient(135deg,#00f5ff,#6a00ff);
    padding: 10px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    margin-bottom: 20px;
}

.history {
    font-size: 14px;
    color: #aaa;
}

/* Main */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* Chat */
.chat-box {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

/* Message */
.message {
    margin-bottom: 15px;
    display: flex;
}

.user {
    justify-content: flex-end;
}

.bot {
    justify-content: flex-start;
}

.bubble {
    max-width: 70%;
    padding: 12px;
    border-radius: 12px;
}

.user .bubble {
    background: linear-gradient(135deg,#00f5ff,#6a00ff);
}

.bot .bubble {
    background: #1e1e2f;
}

/* Input */
.input-area {
    display: flex;
    padding: 15px;
    border-top: 1px solid #222;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #1a1a2e;
    color: white;
}

button {
    margin-left: 10px;
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg,#00f5ff,#6a00ff);
    color: white;
    cursor: pointer;
}

/* Scroll */
.chat-box::-webkit-scrollbar {
    width: 6px;
}
.chat-box::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 10px;
}

/* Typing animation */
.typing {
    font-size: 14px;
    color: #aaa;
    animation: blink 1s infinite;
}

@keyframes blink {
    0% {opacity: 0.2;}
    50% {opacity: 1;}
    100% {opacity: 0.2;}
}

/* Toggle */
.toggle {
    position: absolute;
    top: 15px;
    right: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>🤖 AI Pro</h2>
    <div class="new-chat" onclick="newChat()">+ New Chat</div>
    <div class="history" id="history">No history</div>
</div>

<div class="main">
    <div class="chat-box" id="chat"></div>

    <div class="input-area">
        <input type="text" id="prompt" placeholder="Type message...">
        <button onclick="send()">Send</button>
    </div>
</div>

<script>
let chatHistory = [];

function addMessage(text, type) {
    const chat = document.getElementById("chat");

    const msg = document.createElement("div");
    msg.className = "message " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerText = text;

    msg.appendChild(bubble);
    chat.appendChild(msg);

    chat.scrollTop = chat.scrollHeight;
}

async function send() {
    const input = document.getElementById("prompt");
    const text = input.value;
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    addMessage("Typing...", "bot");

    try {
        const res = await fetch("/generate", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ prompt: text })
        });

        const data = await res.json();

        document.querySelector(".bot:last-child").remove();
        addMessage(data.reply, "bot");

        chatHistory.push(text);
        updateHistory();

    } catch {
        document.querySelector(".bot:last-child").remove();
        addMessage("Error ❌", "bot");
    }
}

function updateHistory() {
    const historyBox = document.getElementById("history");
    historyBox.innerHTML = chatHistory.map(h => `<div>• ${h}</div>`).join("");
}

function newChat() {
    document.getElementById("chat").innerHTML = "";
    chatHistory = [];
    updateHistory();
}
</script>

</body>
</html>
