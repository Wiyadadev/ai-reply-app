<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #0f0f0f;
    color: white;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* Header */
.header {
    padding: 15px 20px;
    font-weight: 600;
    font-size: 18px;
    border-bottom: 1px solid #222;
}

/* Chat */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

/* Message */
.msg {
    margin-bottom: 15px;
    display: flex;
}

.user { justify-content: flex-end; }
.bot { justify-content: flex-start; }

.bubble {
    max-width: 70%;
    padding: 12px;
    border-radius: 12px;
    font-size: 14px;
}

.user .bubble {
    background: linear-gradient(135deg,#00f5ff,#6a00ff);
}

.bot .bubble {
    background: #1e1e2f;
}

/* Input */
.input-area {
    display: flex;
    padding: 15px;
    border-top: 1px solid #222;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #1a1a2e;
    color: white;
}

button {
    margin-left: 10px;
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg,#00f5ff,#6a00ff);
    color: white;
    cursor: pointer;
}

/* Error text */
.error {
    color: #ff4d4d;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="header">🤖 AI Assistant</div>

<div class="chat" id="chat"></div>

<div class="input-area">
    <input type="text" id="prompt" placeholder="Type message...">
    <button onclick="send()">Send</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("prompt");

function addMessage(text, type, isError=false) {
    const msg = document.createElement("div");
    msg.className = "msg " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if(isError){
        bubble.innerHTML = `<span class="error">${text}</span>`;
    } else {
        bubble.innerText = text;
    }

    msg.appendChild(bubble);
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
}

async function send() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    const typing = document.createElement("div");
    typing.className = "msg bot";
    typing.innerHTML = `<div class="bubble">Typing...</div>`;
    chat.appendChild(typing);

    chat.scrollTop = chat.scrollHeight;

    try {
        const res = await fetch("/generate", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ prompt: text })
        });

        // 🔥 เช็ค response ก่อน
        if (!res.ok) {
            throw new Error("Server error: " + res.status);
        }

        const data = await res.json();

        typing.remove();

        if (!data.reply) {
            throw new Error("No reply from server");
        }

        addMessage(data.reply, "bot");

    } catch (err) {
        typing.remove();
        addMessage("❌ " + err.message, "bot", true);
        console.error(err);
    }
}

// Enter ส่ง
input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") send();
});
</script>

</body>
</html>
