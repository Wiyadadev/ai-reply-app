<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Reply App</title>
</head>
<body>

    <h1>AI Reply Assistant 🤖</h1>

    <form method="POST">
        <input type="text" name="text" placeholder="Type something..." />
        <button type="submit">Generate</button>
    </form>

    {% if result %}
        <h3>Result:</h3>
        <p>{{ result }}</p>
    {% endif %}

</body>
</html>
